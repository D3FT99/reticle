# Builds and tests every push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build (Debug and Release)
        run: |
          dotnet build Reticle.slnx -c Debug
          dotnet build Reticle.slnx -c Release
      - name: Test
        run: dotnet test Reticle.slnx -c Release --no-build
