# Builds, signs and publishes a Reticle release with its installer.
#
# Start a release in either of two ways:
#   - push a tag:      git tag v1.2.0; git push origin v1.2.0
#   - run manually:    Actions > Release > Run workflow, enter the version (e.g. 1.2.0); the tag is created for you
#
# Versions with a hyphen (1.2.0-beta.1) are published as pre-releases.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_CERT_PFX           base64 of the CN=Reticle code-signing certificate (.pfx)
#   SIGNING_CERT_PASSWORD      password of that .pfx
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.2.0 or 1.2.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $v = $env:INPUT_VERSION.Trim().TrimStart('v') }
          else { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$v' is not a semantic version (1.2.3 or 1.2.3-beta.1)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Output "Releasing $v"

      - uses: actions/checkout@v5

      - name: Fail if the release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists" }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Reticle.slnx -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }

      - name: Import signing certificate
        shell: pwsh
        env:
          SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_PFX) { throw 'The SIGNING_CERT_PFX secret is not set. See the Release-Process wiki page.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          # Tolerate whitespace or a byte-order mark picked up when the secret was set.
          $base64 = $env:SIGNING_CERT_PFX -replace '[^A-Za-z0-9+/=]', ''
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
          try {
            $password = ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD.Trim([char]0xFEFF, ' ', "`r", "`n") -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally { Remove-Item $pfx -Force }
          Write-Output "Imported $($cert.Subject) ($($cert.Thumbprint)), valid until $($cert.NotAfter.ToString('yyyy-MM-dd'))"

      - name: Build signed installer
        shell: pwsh
        run: ./tools/build-installer.ps1 -Version '${{ steps.version.outputs.version }}' -NoCreateCert

      - name: Checksums
        shell: pwsh
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = "Reticle-$env:VERSION-setup.exe", 'Reticle-signing.cer'
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $_" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $notes = @"
          ## Install

          Download **Reticle-$env:VERSION-setup.exe** below and run it. It needs administrator approval, installs to
          ``C:\Program Files\Reticle`` and trusts the Reticle signing certificate on this machine so clicks reach
          elevated windows. Only install it on machines you control.

          Requires Windows 10 or 11 (x64). ``SHA256SUMS.txt`` lists the file hashes.
          "@
          $ghArgs = @($env:TAG, "Reticle-$env:VERSION-setup.exe", 'Reticle-signing.cer', 'SHA256SUMS.txt',
                      '--title', "Reticle $env:VERSION", '--notes', $notes, '--generate-notes', '--target', $env:GITHUB_SHA)
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - name: Remove signing certificate
        if: always()
        # Windows PowerShell: its certificate provider supports -DeleteKey, PowerShell 7's does not.
        shell: powershell
        # -DeleteKey is a dynamic parameter: it binds only with an explicit Cert: path, not from the pipeline.
        run: |
          Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -eq 'CN=Reticle' | ForEach-Object {
            Remove-Item -Path "Cert:\CurrentUser\My\$($_.Thumbprint)" -DeleteKey
            Write-Output "Removed $($_.Thumbprint)"
          }
